name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests infra/lambda

      - name: Test
        run: python -m pytest -q

      # Exercises the cloud-only paths -- Kinesis batching, the Lambda
      # envelopes, DynamoDB replay memory, ASFF through BatchImportFindings --
      # against moto, with no credentials and no network.
      - name: AWS integration tests
        run: python -m pytest -q tests/test_integration_aws.py

      # The scorecard is the real regression gate: a change that stops detecting
      # one of the five scenarios fails here even if every unit test passes.
      - name: Detection scorecard
        run: python -m gsd.cli demo --minutes 1440

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Format check
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: Validate
        run: |
          terraform -chdir=infra/terraform init -backend=false
          terraform -chdir=infra/terraform validate
