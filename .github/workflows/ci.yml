name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests infra/lambda

      - name: Test
        run: python -m pytest -q

      # Exercises the cloud-only paths -- Kinesis batching, the Lambda
      # envelopes, DynamoDB replay memory, ASFF through BatchImportFindings --
      # against moto, with no credentials and no network.
      - name: AWS integration tests
        run: python -m pytest -q tests/test_integration_aws.py

      # The scorecard is the real regression gate: a change that stops detecting
      # one of the five scenarios fails here even if every unit test passes.
      - name: Detection scorecard
        run: python -m gsd.cli demo --minutes 1440

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Format check
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: Validate
        run: |
          terraform -chdir=infra/terraform init -backend=false
          terraform -chdir=infra/terraform validate

  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[paper]"

      - name: TeX Live
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-fonts-recommended \
            texlive-latex-extra texlive-publishers texlive-lang-portuguese latexmk

      # Rebuilds the figures, tables and macros from scratch and then both
      # manuscripts: a change that moves a number cannot leave the paper stale.
      - name: Regenerate results and build both PDFs
        run: make -C paper all

      - name: Fail if a generated artefact drifted from the committed one
        run: |
          git diff --stat -- paper/data paper/figures
          git diff --quiet -- paper/data/table_corpus.tex || {
            echo "committed tables differ from a fresh run"; exit 1; }

      # The journal version has hard limits -- page count, abstract length --
      # that are cheap to break by accident and expensive to discover at the
      # submission desk.
      - name: Build the IEEE submission and check its formatting rules
        run: make -C IEEE all

      - uses: actions/upload-artifact@v4
        with:
          name: papers
          path: |
            paper/main.pdf
            paper/main-pt.pdf
            IEEE/main.pdf
